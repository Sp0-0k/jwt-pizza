name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  id-token: write # Required for requesting the JWT
  contents: read # Required for actions/checkout
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    services:
      # The Playwright tests run against a real backend. MYSQL_DATABASE is deliberately not set: the backend
      # creates the database itself, and only does that (and seeds the default admin a@jwt.com) when it is missing.
      mysql:
        image: mysql:8.0.29
        env:
          MYSQL_ROOT_PASSWORD: tempdbpassword
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -ptempdbpassword" --health-interval 10s --health-start-period 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > public/version.json

      - name: Build
        run: |
          npm ci && npm run build

      - name: Update dist artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: dist/

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Sp0-0k/jwt-pizza-service
          path: jwt-pizza-service

      - name: Start backend
        working-directory: jwt-pizza-service
        run: |
          npm ci
          cat > src/config.js <<EOF
          module.exports = {
            jwtSecret: '$(openssl rand -hex 32)',
            db: {
              connection: {
                host: '127.0.0.1',
                user: 'root',
                password: 'tempdbpassword',
                database: 'pizza',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: 'https://pizza-factory.cs329.click',
              apiKey: '${{ secrets.FACTORY_API_KEY }}',
            },
          };
          EOF
          nohup node src/index.js > ../backend.log 2>&1 &
          # wait until the backend is up and the default admin has been seeded
          for i in $(seq 1 30); do
            if curl -sf -X PUT localhost:3000/api/auth -H 'Content-Type: application/json' -d '{"email":"a@jwt.com","password":"admin"}' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend.log
          echo "backend did not become ready" && exit 1

      # - name: Run tests
      #   run: |
      #     npx playwright install --with-deps chromium
      #     npm run test:coverage

      # - name: Update coverage
      #   run: |
      #     coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)
      #     color=$(echo "$coverage < 80" | bc | awk '{if ($1) print "red"; else print "green"}')
      #     curl -s -X POST "https://pizza-factory.cs329.click/api/badge/${{ secrets.NET_ID }}/jwtpizzacoverage?label=Coverage&value=$coverage%25&color=$color" -H "authorization: bearer ${{ secrets.FACTORY_API_KEY }}"

  deploy:
    needs: build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    env:
      version: ${{needs.build.outputs.version}}
    steps:
      - name: Create OIDC token to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}

      - name: Download dist artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: package
          path: dist/

      - name: Push to AWS S3
        run: |
          echo Deploying $version
          aws s3 cp dist s3://${{ secrets.APP_BUCKET }} --recursive
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"